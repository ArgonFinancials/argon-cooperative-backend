# Installed by deploy/85-install-nginx.sh as /etc/nginx/sites-available/argon.
#
# LOOPBACK ONLY until a domain and TLS exist. Sign-in and the PIN step-up take
# PINs, so they are NEVER served over plain HTTP: this server proxies /healthz
# and refuses everything else, in the API's own error format. When TLS exists
# a 443 server takes over the API; this one stays for healthz alone.
server {
    listen 127.0.0.1:80 default_server;
    server_name _;
    server_tokens off;

    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        default_type application/json;
        return 403 '{"code":"tls_required","message":"This API is served over HTTPS only; plain HTTP carries /healthz alone."}';
    }
}
