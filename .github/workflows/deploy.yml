# Tier 1 first, then deploy. See deploy/README.md, "CI/CD".
#
#   tier1  — every acceptance suite's mutation run (mutate.sh <suite> --svc)
#            against PostgreSQL 18 in a service container on the runner: the
#            tests must pass on the real migrations AND turn red on every
#            deliberately broken schema and service. Runs on every push and PR.
#   deploy — ONLY when a person runs this workflow by hand ("Run workflow", on
#            main) and types the commit they mean to deploy; never on a push.
#            After tier1 passes in that same run. Streams `git archive` of the
#            commit to the server as the dedicated user argon-deploy, whose key
#            can run one command (deploy/argon-deploy) and nothing else. Never
#            the key that opens other hosts.
#
# Why a manual trigger and not required reviewers: the org is on GitHub Free
# and the repo is private, where environment reviewers need Enterprise. The
# limit: anyone with WRITE access could edit this file to drop these checks
# (Free has no branch protection for private repos). Write access is the real
# boundary; keep it to the people on ARGON_DEPLOYERS.
#
# Repository settings this needs (none of them is in this file):
#   secret   ARGON_DEPLOY_KEY   the PRIVATE half of the argon-deploy ed25519 key
#   secret   ARGON_FRONTEND_KEY the PRIVATE half of a READ-ONLY deploy key on the
#                               frontend repository: the frontend job checks out the
#                               commit deploy/frontend.ref pins, and nothing else
#   variable ARGON_APP_API_URL  the API's public origin, baked into the frontend at
#                               build time (NEXT_PUBLIC_ARGON_API_URL)
#
# ONE COMMIT IS ONE DEPLOYED STATE, ACROSS TWO REPOSITORIES. The frontend is
# part of what the backend carries: deploy/frontend.ref pins the frontend
# commit, the frontend job builds exactly that commit (a static export) on
# every push, and the deploy ships it inside the same release archive as the
# backend. A frontend push deploys nothing until a backend commit moves the
# pin; moving it is reviewed and tested like any other backend change.
#   variable ARGON_DEPLOY_HOST  the server's hostname
#   variable ARGON_DEPLOYERS    GitHub logins allowed to deploy, comma-separated
#                               (changing it needs repo admin)
name: tier1-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      confirm_commit:
        description: "Deploy THIS commit: type the first 7+ characters of main's latest commit id"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tier1:
    # On push and PR the gate is skipped and tier1 runs; on a manual run it
    # waits for the gate and does not run at all if the gate refused.
    needs: gate
    if: ${{ !cancelled() && needs.gate.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ["0002", "0003", "0004", "0005", "0006", "0007", "0008", "0009", "0010", "0011", "0012", "0013", "0014", "0015", "0016", "0017", "0018", "0019", "0020", "0021", "0022", "0023", "0024", "0025", "0026", "0027", "0028", "0029", "0030", "0031", "0032", "0033", stepup, api, batch, stepup_api, signin_api, books, loans_api, approvals_api, money_api, me_api, requests_api, balance_api, cors_api, spec_api, session_api, sms, sms_api, pin, locks_api, enrol, enrol_api, vfd, wallet, webhook_api, members_api, claims_api, resolutions_api]
    services:
      postgres:
        image: postgres:18-trixie
        env:
          # A throwaway server inside a throwaway runner: not a secret.
          POSTGRES_PASSWORD: ci-ephemeral-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"   # the server's GO_VERSION (deploy/env/ec2.env.example)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # The client's packages are cached (2026-11-10, four mirror stalls in one
      # day): a stalled mirror matters only when the cache is empty. The key
      # turns over monthly, so security updates still arrive.
      - name: Month (the cache key turns over with it)
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: PostgreSQL 18 client packages, from the cache
        id: pgcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pg-client-debs
          key: pg18-client-debs-ubuntu-24.04-${{ steps.month.outputs.month }}-${{ hashFiles('scripts/ci-pg-client.sh') }}
      - name: PostgreSQL 18 client (the server's major)
        # A stalled package mirror once hung this step for 40+ minutes, saying
        # nothing (2026-10-22). The script fails fast and says it is CI setup,
        # not a test; this limit is the backstop.
        timeout-minutes: 10
        env:
          CI_PG_DEB_CACHE: ${{ runner.temp }}/pg-client-debs
        run: bash scripts/ci-pg-client.sh
      # Saved right after the install, not at the end of the job, so a red
      # suite still leaves the cache filled. Many matrix jobs race to save the
      # same key; one wins and the others only warn.
      - name: PostgreSQL 18 client packages, into the cache
        if: steps.pgcache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pg-client-debs
          key: ${{ steps.pgcache.outputs.cache-primary-key }}
      - name: Env file (TARGET=local against the service container)
        run: |
          pw() { openssl rand -base64 24 | tr -d '/+='; }
          umask 077
          cat > deploy/env/ci.env <<EOF
          TARGET=local
          ARGON_DB=argon_test
          PGPORT=5432
          POSTGRES_SUPERUSER=postgres
          POSTGRES_PASSWORD=ci-ephemeral-superuser
          ARGON_MIGRATOR_PASSWORD=$(pw)
          ARGON_APP_PASSWORD=$(pw)
          ARGON_BACKUP_PASSWORD=$(pw)
          ARGON_AUTH_PASSWORD=$(pw)
          ARGON_WALLET_PASSWORD=$(pw)
          ARGON_CODE_KEY=$(openssl rand -hex 32)
          ARGON_CSRF_KEY=$(openssl rand -hex 32)
          BACKUP_STORE=file://./.backups
          EOF
          echo "ARGON_ENV=$PWD/deploy/env/ci.env" >> "$GITHUB_ENV"
      # The probe (run by mutate.sh after GREEN, as argon_app) builds its scratch
      # database with migrate, as the server does. Same version as the server
      # (deploy/env/ec2.env.example); read back from the binary, not `-version`.
      - name: migrate CLI (the server's version)
        run: |
          MIGRATE_VERSION=v4.18.1
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install -tags postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@$MIGRATE_VERSION"
          got=$(go version -m "$RUNNER_TEMP/bin/migrate" | awk '$1 == "mod" && $2 == "github.com/golang-migrate/migrate/v4" {print $3}')
          [[ $got == "$MIGRATE_VERSION" ]] || { echo "migrate is module version '${got:-unknown}', not $MIGRATE_VERSION"; exit 1; }
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Roles
        run: bash deploy/20-roles.sh
      - name: Mutation run, suite ${{ matrix.suite }}
        run: bash test/tier1/mutate.sh "${{ matrix.suite }}" --svc
      # The operator's script calls 0014's functions: tested where 0014 is.
      - name: Operator script (45-society-settings.sh)
        if: matrix.suite == '0014'
        run: bash test/ops/society_settings_test.sh
      # And 0023's, with its backup gate: the tests, then every rule sabotaged.
      - name: Operator script (46-create-society.sh)
        if: matrix.suite == '0023'
        run: bash test/ops/create_society_test.sh
      - name: Operator script (46-create-society.sh), every rule sabotaged
        if: matrix.suite == '0023'
        run: bash test/ops/sabotage_create_society.sh
      # And 0027's: the founding officers, and the slip printed once.
      - name: Operator script (47-founding-officer.sh)
        if: matrix.suite == '0027'
        run: bash test/ops/founding_officer_test.sh
      - name: Operator script (47-founding-officer.sh), every rule sabotaged
        if: matrix.suite == '0027'
        run: bash test/ops/sabotage_founding_officer.sh
      # The deploy's roles step and the scratch database's cleanup (finding 73).
      # With 0028, the release that added a role.
      - name: Deploy roles and scratch cleanup (40-migrate.sh, lib.sh)
        if: matrix.suite == '0028'
        run: bash test/ops/deploy_roles_test.sh
      - name: Deploy roles and scratch cleanup, every rule sabotaged
        if: matrix.suite == '0028'
        run: bash test/ops/sabotage_deploy_roles.sh

  # The client install's FAILURE PATH, made to fire on every push (a failure
  # path is proven by making it fire, finding 47). apt is pointed at a proxy
  # that never answers (TEST-NET-1, RFC 5737), and the real install script must
  # fail FAST and SAY it is CI setup, not a test. This job passes only if it
  # does; a script that hangs or reports success fails it.
  #
  # And THE CACHE (2026-11-10): with the mirror dead, a filled cache must
  # install a psql that answers as 18, read back here and not taken from the
  # script's word; a cache that does not install must still fail fast, saying
  # so. The cache is filled first, while the mirror answers (restored from the
  # tier1 jobs' cache when there is one).
  ci-setup-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # (No job-level env naming runner.temp: the runner context does not exist
    # there, and GitHub rejected the whole workflow for it, 2026-11-10. The
    # steps name the directory from $RUNNER_TEMP themselves.)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Month (the cache key turns over with it)
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pg-client-debs
          key: pg18-client-debs-ubuntu-24.04-${{ steps.month.outputs.month }}-${{ hashFiles('scripts/ci-pg-client.sh') }}
      - name: Fill the cache while the mirror answers
        timeout-minutes: 10
        run: |
          DEBS="$RUNNER_TEMP/pg-client-debs"
          CI_PG_DEB_CACHE="$DEBS" bash scripts/ci-pg-client.sh
          n=$(ls "$DEBS"/*.deb 2>/dev/null | wc -l)
          echo "the cache holds $n packages"; ls "$DEBS"
          (( n > 0 )) || { echo "::error::an install left nothing in the cache"; exit 1; }
          # Off again, so the next steps must install it themselves.
          sudo dpkg --purge postgresql-client-18
          [[ ! -e /usr/lib/postgresql/18/bin/psql ]] || { echo "::error::psql 18 is still there after the purge"; exit 1; }
      - name: The checks, then every cache rule sabotaged
        run: CI_PG_DEB_CACHE="$RUNNER_TEMP/pg-client-debs" bash scripts/ci-pg-client-selftest.sh

  # Every suite runs here, or this fails (finding 52): the matrix above is a
  # list written by hand, and balance_api reached main without ever running.
  # Compared with the suite files both ways, and with mutate.sh's list.
  suite-list:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every suite is in the matrix and in mutate.sh, and nothing else is
        run: bash scripts/check-suite-list.sh

  # Going live (2026-10-30): nginx in front of the API on its public name, the
  # origin rule and the loopback guard, run against real nginx with the
  # rendered templates; then every rule sabotaged one copy at a time, each of
  # which must turn its own test red.
  going-live-ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: nginx (fail fast, saying it is CI setup)
        timeout-minutes: 6
        run: |
          if ! command -v /usr/sbin/nginx >/dev/null; then
            sudo timeout 240 apt-get -y -q -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update &&
            sudo timeout 240 apt-get -y -q -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install nginx-core ||
              { echo "::error title=CI setup, not a test::nginx did not install: the package mirror. Nothing was tested."; exit 1; }
          fi
          /usr/sbin/nginx -v
      - name: The tests
        run: NGINX_BIN=/usr/sbin/nginx bash test/ops/going_live_test.sh
      - name: Every rule sabotaged, each caught
        run: NGINX_BIN=/usr/sbin/nginx bash test/ops/sabotage_going_live.sh
      # The app's site (2026-11-14): the static export beside the API.
      - name: The app's site
        run: NGINX_BIN=/usr/sbin/nginx bash test/ops/app_site_test.sh
      - name: The app's site, every rule sabotaged
        run: NGINX_BIN=/usr/sbin/nginx bash test/ops/sabotage_app_site.sh site
      - name: The frontend's install
        run: bash test/ops/frontend_install_test.sh
      - name: The frontend's install, every rule sabotaged
        run: bash test/ops/sabotage_app_site.sh install

  # The frontend the release carries: the commit deploy/frontend.ref pins,
  # built here (a 1-2 GB build beside Postgres on the instance is how the
  # database gets killed), as a static export. On every push, so a pin that
  # does not build fails before anyone deploys it. No pin: no frontend.
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pinned frontend commit
        id: pin
        run: |
          if [[ ! -f deploy/frontend.ref ]]; then
            echo "::notice::deploy/frontend.ref does not exist: this release carries no frontend"
            echo "sha=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sha=$(grep -vE '^[[:space:]]*(#|$)' deploy/frontend.ref | tr -d '[:space:]')
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::deploy/frontend.ref must hold one full 40-character commit id, and comments"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "frontend commit ${sha:0:12}"
      - name: The key and the API address are set
        if: steps.pin.outputs.sha != ''
        env:
          KEY: ${{ secrets.ARGON_FRONTEND_KEY }}
          API_URL: ${{ vars.ARGON_APP_API_URL }}
        run: |
          [[ -n $KEY ]] || { echo "::error::secret ARGON_FRONTEND_KEY is not set: the pinned frontend cannot be checked out"; exit 1; }
          [[ $API_URL =~ ^https://[a-z0-9.-]+$ ]] || { echo "::error::variable ARGON_APP_API_URL must be the API's https origin, not '$API_URL'"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pin.outputs.sha != ''
        with:
          repository: ArgonFinancials/Argon_Cooperative_Frontend
          ref: ${{ steps.pin.outputs.sha }}
          ssh-key: ${{ secrets.ARGON_FRONTEND_KEY }}
          persist-credentials: false
          path: frontend-src
      - name: The checkout is the pinned commit
        if: steps.pin.outputs.sha != ''
        env:
          SHA: ${{ steps.pin.outputs.sha }}
        run: |
          got=$(git -C frontend-src rev-parse HEAD)
          [[ $got == "$SHA" ]] || { echo "::error::checked out $got, not the pin $SHA"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pin.outputs.sha != ''
        with:
          node-version: 24
      - name: Build the static export
        if: steps.pin.outputs.sha != ''
        working-directory: frontend-src
        env:
          NEXT_PUBLIC_ARGON_API_URL: ${{ vars.ARGON_APP_API_URL }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
      - name: The export is whole, and carries the API's address
        if: steps.pin.outputs.sha != ''
        env:
          API_URL: ${{ vars.ARGON_APP_API_URL }}
        run: |
          o=frontend-src/out
          [[ -f $o/index.html && -f $o/404.html && -d $o/_next/static ]] ||
            { echo "::error::no static export at $o (index.html, 404.html, _next/static): is output export set in next.config?"; exit 1; }
          grep -rlqF "$API_URL" "$o/_next/static" || { echo "::error::the export does not carry $API_URL"; exit 1; }
          odd=$(find "$o" ! -type f ! -type d | head -3)
          [[ -z $odd ]] || { echo "::error::the export contains something that is not a file: $odd"; exit 1; }
          echo "export: $(find "$o" -type f | wc -l) files, $(du -sh "$o" | cut -f1)"
          tar -C "$o" -czf "$RUNNER_TEMP/frontend-export.tgz" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pin.outputs.sha != ''
        with:
          name: frontend-export
          path: ${{ runner.temp }}/frontend-export.tgz
          retention-days: 7
          if-no-files-found: error

  # The gate: who, and which commit. Its own job so a refusal comes in seconds
  # and the deploy job never starts. Inputs reach the script as environment
  # variables, never as text pasted into it.
  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Who, and which commit
        env:
          ACTOR: ${{ github.triggering_actor }}
          DEPLOYERS: ${{ vars.ARGON_DEPLOYERS }}
          CONFIRM: ${{ inputs.confirm_commit }}
          REF: ${{ github.ref }}
        run: |
          [[ $REF == refs/heads/main ]] || { echo "::error::deploys come from main only, not $REF"; exit 1; }
          [[ -n $DEPLOYERS ]] || { echo "::error::repository variable ARGON_DEPLOYERS is not set: nobody may deploy"; exit 1; }
          [[ ",${DEPLOYERS// /}," == *",$ACTOR,"* ]] || { echo "::error::$ACTOR is not on ARGON_DEPLOYERS"; exit 1; }
          [[ $CONFIRM =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::confirm_commit must be 7-40 hex characters of the commit id"; exit 1; }
          [[ $GITHUB_SHA == "$CONFIRM"* ]] || { echo "::error::you confirmed $CONFIRM, but main is at ${GITHUB_SHA:0:12}: refusing to deploy a commit nobody confirmed"; exit 1; }
          echo "deploying ${GITHUB_SHA:0:12}, confirmed by $ACTOR"

  deploy:
    needs: [gate, tier1, suite-list, ci-setup-selftest, going-live-ops, frontend]
    # Never on a push: only a person running the workflow by hand, on main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: argon-deploy
      cancel-in-progress: false   # never cut a deploy off mid-migration
    env:
      ARGON_DEPLOY_HOST: ${{ vars.ARGON_DEPLOY_HOST }}
      # PINNED: the server's own host key. A server answering with any other
      # key is refused; the variable cannot redirect a deploy to another host.
      ARGON_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM6oRp+QC30/BqW45nTgtJyJCU3Gu6+IekXxw2Xag84M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.frontend.outputs.sha != ''
        with:
          name: frontend-export
          path: ${{ runner.temp }}/fe
      - name: Release archive of this commit, with the frontend it pins
        env:
          FE_SHA: ${{ needs.frontend.outputs.sha }}
        run: |
          r="$RUNNER_TEMP/release.tar"
          if [[ -n $FE_SHA ]]; then
            git archive --format=tar --add-virtual-file="COMMIT:$GITHUB_SHA" --add-virtual-file="FRONTEND_COMMIT:$FE_SHA" -o "$r" HEAD
            mkdir -p "$RUNNER_TEMP/rel/frontend"
            tar -C "$RUNNER_TEMP/rel/frontend" -xzf "$RUNNER_TEMP/fe/frontend-export.tgz"
            tar -C "$RUNNER_TEMP/rel" --owner=0 --group=0 -rf "$r" frontend
            echo "release ${GITHUB_SHA:0:12} carries frontend ${FE_SHA:0:12}"
          else
            git archive --format=tar --add-virtual-file="COMMIT:$GITHUB_SHA" -o "$r" HEAD
            echo "release ${GITHUB_SHA:0:12} carries no frontend (no pin)"
          fi
          gzip -9 -c "$r" > "$RUNNER_TEMP/release.tgz"
          ls -l "$RUNNER_TEMP/release.tgz"
      - name: Deploy as argon-deploy
        env:
          DEPLOY_KEY: ${{ secrets.ARGON_DEPLOY_KEY }}
        run: |
          [[ -n $ARGON_DEPLOY_HOST ]] || { echo "::error::repository variable ARGON_DEPLOY_HOST is not set"; exit 1; }
          [[ -n $DEPLOY_KEY ]] || { echo "::error::secret ARGON_DEPLOY_KEY is not set"; exit 1; }
          k="$RUNNER_TEMP/argon_deploy"; kh="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$k"' EXIT
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$k")
          printf '%s %s\n' "$ARGON_DEPLOY_HOST" "$ARGON_HOST_KEY" > "$kh"
          ssh -i "$k" -o IdentitiesOnly=yes -o IdentityAgent=none \
              -o UserKnownHostsFile="$kh" -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \
              -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 \
              "argon-deploy@$ARGON_DEPLOY_HOST" < "$RUNNER_TEMP/release.tgz"
