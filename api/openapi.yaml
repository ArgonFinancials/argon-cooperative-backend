openapi: 3.0.3
info:
  title: Argon Cooperative Platform API
  version: 0.1.0
  description: |
    Authored here; vendored by the frontend repository as a pinned, committed
    copy. The frontend generates its TypeScript client from that copy and CI
    fails on any diff, so it cannot go stale.

    MONEY IS A STRING ON THE WIRE, never a JSON number. A JSON number is an
    IEEE-754 double, so a number would silently violate "never a float, at any
    layer" at the one layer nobody inspects. Every money field is
    `type: string, pattern: ^-?[0-9]+$`, in kobo.

    Every enum below names the decision it came from. The semantics were settled
    in the design package; this file is where they are read, not where they are
    decided.

components:
  schemas:
    Kobo:
      type: string
      pattern: '^-?[0-9]+$'
      description: |
        An amount in kobo. ₦1 = 100 kobo. A STRING because a JSON number is a
        float. Positive is a debit, negative a credit.
      example: "48000000"

    MovementKind:
      type: string
      description: |
        Every movement of money in the product. Mirrors the movement_kind enum
        in the database and the MovementKind union in the frontend; all three
        are generated from this.

        opening_balance and payroll_remittance carry NO CHARGE. opening_balance
        is free deliberately, not by oversight: charging on a migration takes a
        cut of money that was in the society's books before Argon existed. It is
        also not a contribution — a member's statement must not say they
        contributed on the day the software changed.
      enum:
        - contribution_in
        - withdrawal_out
        - loan_disbursement
        - loan_repayment
        - transfer_out
        - payroll_remittance
        - project_funding
        - opening_balance
        - loan_write_off
        - loan_recovery

    MoneyState:
      type: string
      description: |
        The nine money states. ONE definition, consumed by every surface. Two
        independent definitions of one state was the most expensive defect in
        design review, which is why this is generated rather than written twice.

        Presentation — colour, dot shape, weight — stays in the frontend. This
        enum carries the states themselves and nothing else.
      enum:
        - draft
        - pending
        - awaiting
        - inflight
        - settled
        - reversed
        - conflict
        - synced
        - queried

    ChargeRole:
      type: string
      description: |
        The partner charge and the Argon margin are recorded SEPARATELY. Summed
        into one total the pass-through-versus-margin distinction is
        unrecoverable from history, and transaction charges are the only revenue
        line in the product. D-03, D-07. VAT on Argon's fee and the transfer
        levy are their own lines too (0011, 0013). The same list as the
        schema's ledger_lines.charge_role (TestApiSpec01).
      enum: [principal, partner_charge, argon_margin, vat, statutory_levy]

    PostedRecord:
      type: object
      required: [reference, rows, totalKobo, postedAt, alreadyPosted]
      properties:
        reference:
          type: string
          description: The client-minted idempotency key. The server never generates one.
        rows: { type: integer }
        totalKobo: { $ref: '#/components/schemas/Magnitude' }
        asOf:
          type: string
          format: date
          nullable: true
          description: |
            The society's own as-at date. NEVER the posting date. A member whose
            savings accrued over seven years must not have a ledger that begins
            on the day the software changed.
        postedAt: { type: string, format: date-time }
        alreadyPosted:
          type: boolean
          description: |
            True when this reference had already been committed and nothing was
            written. The rest of this object still describes what the FIRST
            commit did — an admin who committed under the wrong as-at date has
            to be told which date the balances actually carry, and a bare
            acknowledgement cannot say.

    SignInRequest:
      type: object
      required: [credential, pin]
      properties:
        credential: { type: string, description: A member number or a phone number. }
        pin: { type: string }
        deviceToken:
          type: string
          description: |
            NON-BROWSER CLIENTS ONLY: the token this server issued to this
            device on an earlier sign-in; absent on a new device. A browser
            sends none (its device rides in the __Secure-argon_device cookie):
            a request with an Origin that carries one is refused, 400
            device_token_from_browser, before the PIN is checked.
        surface:
          type: string
          enum: [member, officer]
          description: Which surface the client is. INFORMATIONAL ONLY; it never sets the session's length.

    VerifyCodeRequest:
      type: object
      required: [challenge, code]
      properties:
        challenge: { type: string }
        code: { type: string }

    SignInResult:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [signed_in, code_sent, see_officer]
        sessionToken:
          type: string
          description: |
            signed_in, NON-BROWSER callers only (no Origin). A browser's
            session is the __Host-argon_session cookie and is never in a body.
        deviceToken:
          type: string
          description: |
            Issued when a new device becomes trusted; NON-BROWSER callers only.
            A browser's device is the __Secure-argon_device cookie.
        csrfToken:
          type: string
          description: |
            signed_in, BROWSER callers only (an Origin was sent): sent back as
            X-CSRF-Token on every state-changing request of this session. Hold
            it in memory only, never in storage, a cookie or a URL; after a
            reload, GET /me returns it again.
        expiresAt:
          type: string
          format: date-time
          description: "signed_in only. 8 hours for anyone holding a post, 30 days otherwise."
        challenge: { type: string, description: "code_sent only. Never contains or implies the code." }
        reason:
          type: string
          description: |
            see_officer only: why. "ambiguous" — the credential matches more
            than one person; "no_agreed_number" — no single registered number
            to send a code to; "sms_unavailable" — TEMPORARY: codes cannot be
            sent yet (no SMS provider), so a new device goes to an officer.
        message: { type: string }

    ActKind:
      type: string
      description: |
        The attributable act a PIN proof is minted FOR (credential_acts.kind).
        contribution_record, withdrawal_payout (0011) and withdrawal_authorisation
        (0012) were missing here and from the auth service until 2026-10-14
        (finding 36, finding 24 recurring): no client could step up to record or
        authorise money.
      enum: [ledger_batch, pin_change, member_reset, phone_change, lock_release,
             signatory_reset_request, signatory_phone_request, signatory_approval,
             guarantee, guarantee_withdrawal, approval_signature, approval_rejection,
             contribution_record, withdrawal_payout, withdrawal_authorisation,
             withdrawal_request]

    PinProofRequest:
      type: object
      required: [pin, act]
      properties:
        pin: { type: string }
        act: { $ref: '#/components/schemas/ActKind' }

    PinProof:
      type: object
      required: [proofId, act, expiresAt]
      properties:
        proofId: { type: string, format: uuid }
        act: { $ref: '#/components/schemas/ActKind' }
        expiresAt: { type: string, format: date-time }

    LedgerBatch:
      type: object
      required: [kind, asOf, confirmedTotalKobo, rows]
      properties:
        kind:
          type: string
          enum: [opening_balance]
          description: The only batch kind so far. Others are added here, each with its own double entry.
        asOf:
          type: string
          format: date
          nullable: true
          description: |
            The society's own as-at date for every row, asked once. null means
            explicitly unknown ("accumulated before migration"). NEVER defaulted
            to the import date, and never in the future.
        confirmedTotalKobo:
          $ref: '#/components/schemas/Magnitude'
        rows:
          type: array
          items: { $ref: '#/components/schemas/BatchRow' }
        pinProofId:
          type: string
          format: uuid
          description: |
            The STEP-UP (0005): a proof from POST /auth/pin-proofs, minted for
            act "ledger_batch", by the caller, in the last five minutes, not yet
            used. Spent by the batch, in the batch's own transaction. Needed only
            when something is about to be WRITTEN: a repeat of a committed
            reference needs none. A refused or failed call does not spend it, so
            a quick retry can reuse it.

    BatchRow:
      type: object
      required: [line, memberId, amountKobo]
      properties:
        line:
          type: integer
          minimum: 1
          description: The row in the uploaded file. Stored on the entry, so a posted line traces back to its source.
        memberId: { type: string, format: uuid }
        amountKobo:
          $ref: '#/components/schemas/Magnitude'

    BatchRefusal:
      type: object
      required: [code, message, rows]
      properties:
        code:
          type: string
          enum:
            - nothing_to_post
            - total_mismatch
            - zero_amount
            - duplicate_member
            - unknown_member
            - member_already_has_balance
            - as_of_in_future
            - period_closed
        message: { type: string }
        rows:
          type: array
          description: The file rows that caused the refusal; empty when it is about the whole batch.
          items:
            type: object
            required: [line, memberId]
            properties:
              line: { type: integer }
              memberId: { type: string, format: uuid }

    Magnitude:
      type: string
      pattern: '^[0-9]+$'
      description: |
        A NON-NEGATIVE amount in kobo: "how much", not a signed line. Used for a
        movement's size (gross). LEDGER_CONTRACT.md §0: a movement's amount is a
        magnitude; only a LINE carries a sign.
      example: "2500000"

    SavingsBalance:
      type: string
      pattern: '^-?[0-9]+$'
      description: |
        A BALANCE, FROM THE MEMBER'S SIDE — NOT a §0 line. Positive means the
        society owes the member this much (they are in credit). Lines follow §0
        (positive = debit), so the member's savings lines that build this
        balance are negative; this field is their negation, computed once, here,
        so no client ever negates anything. Decided 2026-10-01.
      example: "2491250"

    OfficerPost:
      type: string
      enum: [chairman, treasurer, secretary, internal_auditor, branch_officer, loan_officer]

    ChargeLine:
      type: object
      required: [role, amountKobo]
      description: |
        One charge line, as posted. Every component is a SEPARATE line, never
        summed (D-03): the partner's charge, Argon's own fee, VAT on Argon's
        fee, and the transfer levy (0011, 0013). A component that is zero has no
        line (the ledger never writes a ₦0 line; the partner's is zero by D-07).
        §0-signed: a charge taken is a credit (negative); a charge refunded on a
        reversal is a debit (positive), so a refund can never be read as a
        second charge.
      properties:
        role:
          type: string
          enum: [partner_charge, argon_margin, vat, statutory_levy]
        amountKobo: { $ref: '#/components/schemas/Kobo' }

    PostedBy:
      type: object
      required: [userId, post, postLabel]
      description: |
        Who posted the entry, in what post, FROZEN AT POSTING (§4). Present only
        in the officer projection.
      properties:
        userId: { type: string, format: uuid }
        post:
          type: string
          nullable: true
          enum: [chairman, treasurer, secretary, internal_auditor, branch_officer, loan_officer]
        postLabel: { type: string }

    StatementRow:
      type: object
      required: [entryId, postedAt, valueDate, kind, reference, direction, grossKobo,
                 savingsLineKobo, charges, savingsBalanceKobo, reversesEntryId,
                 adjustsEntryId, reason, postedBy]
      properties:
        entryId: { type: string, format: uuid }
        postedAt: { type: string, format: date-time }
        valueDate:
          type: string
          format: date
          nullable: true
          description: |
            The society's as-at date for this movement. NULL means the society's
            records carry no as-at date: render it as "accumulated before
            migration", NEVER as a blank, and never substitute postedAt. A blank
            reads as a bug; a stated unknown reads as a fact.
        kind: { $ref: '#/components/schemas/MovementKind' }
        reference:
          type: string
          nullable: true
          description: The batch reference (an import's client-minted key), if any.
        direction:
          type: string
          enum: [in, out]
          description: |
            Relative to the member's SAVINGS: "in" when their savings rose. Read
            from the member's savings line, never from a bank line (an internal
            transfer has none).
        grossKobo:
          $ref: '#/components/schemas/Magnitude'
        savingsLineKobo:
          $ref: '#/components/schemas/Kobo'
        charges:
          type: array
          description: |
            Every charge line of the entry, each component separately, IN THIS
            ORDER: partner_charge, argon_margin, vat, statutory_levy (what the
            bank took, what Argon took, the tax on Argon's charge, the levy).
            Only the non-zero components appear; the order of those that do is
            fixed, and a client may render the list as sent. Empty when the
            movement is free.
          items: { $ref: '#/components/schemas/ChargeLine' }
        savingsBalanceKobo:
          $ref: '#/components/schemas/SavingsBalance'
        reversesEntryId: { type: string, format: uuid, nullable: true }
        adjustsEntryId: { type: string, format: uuid, nullable: true }
        reason:
          type: string
          nullable: true
          description: Why a reversal or adjustment was made. Shown to the member; it is their money.
        postedBy:
          nullable: true
          description: NULL in the member projection; present in the officer projection. Frozen at posting (§4).
          allOf: [{ $ref: '#/components/schemas/PostedBy' }]

    ChargedInPeriod:
      type: object
      required: [partnerChargeKobo, argonMarginKobo, vatKobo, statutoryLevyKobo]
      description: |
        What the member was charged in the period, NET OF REFUNDS, from the
        member's side (positive = charged), each component apart (D-03). A
        charge refunded by a reversal nets to zero; it is never counted twice.
      properties:
        partnerChargeKobo: { $ref: '#/components/schemas/SavingsBalance' }
        argonMarginKobo: { $ref: '#/components/schemas/SavingsBalance' }
        vatKobo: { $ref: '#/components/schemas/SavingsBalance' }
        statutoryLevyKobo: { $ref: '#/components/schemas/SavingsBalance' }

    MemberStatement:
      type: object
      required: [memberId, memberNumber, memberName, societyId, projection, from, to,
                 openingSavingsBalanceKobo, closingSavingsBalanceKobo, chargedInPeriod, rows]
      description: |
        ONE record, two projections. The member and an officer of the member's
        society are served by the same handler and the same query; the
        projection decides only whether attribution (postedBy) is included.
        Every figure is identical in both.
      properties:
        memberId: { type: string, format: uuid }
        memberNumber: { type: string }
        memberName: { type: string }
        societyId: { type: string, format: uuid }
        projection:
          type: string
          enum: [member, officer]
          description: Which projection this is, so a client never infers it from a missing field.
        from: { type: string, format: date, nullable: true }
        to: { type: string, format: date, nullable: true }
        openingSavingsBalanceKobo: { $ref: '#/components/schemas/SavingsBalance' }
        closingSavingsBalanceKobo: { $ref: '#/components/schemas/SavingsBalance' }
        chargedInPeriod: { $ref: '#/components/schemas/ChargedInPeriod' }
        rows:
          type: array
          description: |
            Ordered by value date (NULL first), then postedAt, then entryId: the
            books' order (decided 2026-10-05). Deterministic (§5).
          items: { $ref: '#/components/schemas/StatementRow' }

    # ---- THE SOCIETY'S BOOKS (LEDGER_CONTRACT §5) ------------------------------
    # Every figure below is §0-SIGNED: positive is a debit, negative a credit. A
    # liability's balance (member savings) is therefore negative. These are the
    # accountant's views; the member-side sign lives only in MemberStatement.
    #
    # DATE BASIS (decided 2026-10-05): the VALUE DATE, the date the movement
    # happened in the society's books, as period close uses. A NULL value date
    # (an opening balance "accumulated before migration") is BEFORE EVERY DATE.
    # Rows are ordered by value date (NULL first), then postedAt, then entryId.

    AccountKind:
      type: string
      enum: [asset, liability, equity, income, expense]

    AccountRole:
      type: string
      description: What an account IS, independent of its society-specific code (0004).
      enum: [member_savings, member_wallet, member_loan, bank, charges_partner,
             charges_margin, migration_control, general, loan_loss, loan_recovery_income,
             charges_vat, statutory_levy_payable]

    Account:
      type: object
      required: [code, name, kind, role, postable]
      properties:
        code: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/AccountKind' }
        role: { $ref: '#/components/schemas/AccountRole' }
        postable:
          type: boolean
          description: False for a grouping account that no line may post to.

    ChartOfAccounts:
      type: object
      required: [societyId, accounts]
      properties:
        societyId: { type: string, format: uuid }
        accounts:
          type: array
          description: Every account of the society, ordered by code.
          items: { $ref: '#/components/schemas/Account' }

    TrialBalanceRow:
      type: object
      required: [code, name, kind, debitsKobo, creditsKobo, balanceKobo]
      description: |
        One account's turnover and balance. debitsKobo is the sum of its debit
        lines (>= 0), creditsKobo the sum of its credit lines (<= 0, SIGNED, so
        debits + credits = balance is a plain sum). Both are shown even when
        they cancel: a reversed contribution is a debit AND a credit, not nothing.
      properties:
        code: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/AccountKind' }
        debitsKobo: { $ref: '#/components/schemas/Kobo' }
        creditsKobo: { $ref: '#/components/schemas/Kobo' }
        balanceKobo: { $ref: '#/components/schemas/Kobo' }

    TrialBalance:
      type: object
      required: [societyId, asOf, rows, totalDebitsKobo, totalCreditsKobo]
      description: |
        Every account of the society (the same set as the chart, zero rows
        included), as at the end of asOf by value date. totalDebitsKobo +
        totalCreditsKobo is ZERO, by construction. If the books ever do not sum
        to zero, the server does not return a trial balance with a variance: it
        refuses with 500 ledger_does_not_balance. That is a defect, never a
        figure to display.
      properties:
        societyId: { type: string, format: uuid }
        asOf: { type: string, format: date }
        rows:
          type: array
          description: Ordered by account code.
          items: { $ref: '#/components/schemas/TrialBalanceRow' }
        totalDebitsKobo: { $ref: '#/components/schemas/Kobo' }
        totalCreditsKobo: { $ref: '#/components/schemas/Kobo' }

    LedgerRow:
      type: object
      required: [entryId, valueDate, postedAt, kind, reference, reason, reversesEntryId,
                 adjustsEntryId, amountKobo, balanceKobo]
      properties:
        entryId: { type: string, format: uuid }
        valueDate:
          type: string
          format: date
          nullable: true
          description: NULL is "accumulated before migration". Never substitute postedAt.
        postedAt: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/MovementKind' }
        reference: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        reversesEntryId: { type: string, format: uuid, nullable: true }
        adjustsEntryId: { type: string, format: uuid, nullable: true }
        amountKobo:
          description: This entry's movement on THIS account (the sum of its lines here), §0-signed.
          allOf: [{ $ref: '#/components/schemas/Kobo' }]
        balanceKobo:
          description: The account's running balance after this row, §0-signed.
          allOf: [{ $ref: '#/components/schemas/Kobo' }]

    GeneralLedger:
      type: object
      required: [societyId, account, from, to, openingBalanceKobo, closingBalanceKobo, rows]
      properties:
        societyId: { type: string, format: uuid }
        account: { $ref: '#/components/schemas/Account' }
        from: { type: string, format: date, nullable: true }
        to: { type: string, format: date, nullable: true }
        openingBalanceKobo:
          description: The balance before `from` (every NULL-dated row counts as before it). Zero with no `from`.
          allOf: [{ $ref: '#/components/schemas/Kobo' }]
        closingBalanceKobo:
          description: The balance at the end of `to`. Equals the trial balance's balanceKobo for this account as at `to`.
          allOf: [{ $ref: '#/components/schemas/Kobo' }]
        rows:
          type: array
          description: Ordered by value date (NULL first), then postedAt, then entryId.
          items: { $ref: '#/components/schemas/LedgerRow' }

    JournalLine:
      type: object
      required: [accountCode, accountName, amountKobo, chargeRole, memberId]
      properties:
        accountCode: { type: string }
        accountName: { type: string }
        amountKobo: { $ref: '#/components/schemas/Kobo' }
        chargeRole:
          description: The line's charge role (D-03), as posted; NULL when it carries none.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ChargeRole' }]
        memberId: { type: string, format: uuid, nullable: true }

    JournalEntry:
      type: object
      required: [entryId, valueDate, postedAt, kind, reference, reason, reversesEntryId,
                 adjustsEntryId, reversedBy, postedBy, lines]
      properties:
        entryId: { type: string, format: uuid }
        valueDate: { type: string, format: date, nullable: true }
        postedAt: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/MovementKind' }
        reference:
          type: string
          nullable: true
          description: The batch reference. Filter on it to audit an import after the fact.
        reason: { type: string, nullable: true }
        reversesEntryId: { type: string, format: uuid, nullable: true }
        adjustsEntryId: { type: string, format: uuid, nullable: true }
        reversedBy:
          type: array
          description: |
            The entries that reverse this one. A DERIVED read (§2): nothing is
            written back to the original. Empty when it stands.
          items: { type: string, format: uuid }
        postedBy: { $ref: '#/components/schemas/PostedBy' }
        lines:
          type: array
          description: Every line, debits before credits, then by account code. They sum to zero.
          items: { $ref: '#/components/schemas/JournalLine' }

    Journal:
      type: object
      required: [societyId, entries]
      properties:
        societyId: { type: string, format: uuid }
        entries:
          type: array
          description: Ordered by value date (NULL first), then postedAt, then entryId.
          items: { $ref: '#/components/schemas/JournalEntry' }

    # ---- LOANS: the read side (LOAN_SHAPE.md sections 1, 5, 6) -------------------
    # The loan says what was AGREED; every figure of what is OWED comes from the
    # ledger (the loan's own entries, by VALUE DATE, as at asOf). Nothing here is
    # stored on the loan. `reason` is the server's sentence for the condition:
    # clients show it, never compose their own.

    LoanCondition:
      type: string
      description: |
        As at asOf. agreed: not disbursed. active: owed, on schedule.
        in_arrears: owed, instalments due and not covered. settled: nothing owed,
        the schedule has ended. settled_early: nothing owed before the schedule
        ended, on a product that allows prepayment. disagreement: the schedule
        and the ledger do not agree (see disagreement.kind); it needs a person,
        and the loan is never edited to agree. written_off: the society decided
        (LOAN_SHAPE.md section 6a) that what was owed will not be recovered; the
        loss is recorded, the debt did not disappear, and it never reads
        settled. Money recovered later is reported in the reason, never as a
        repayment.
      enum: [agreed, active, in_arrears, settled, settled_early, disagreement, written_off]

    LoanDisagreement:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [underpaid, overpaid, prepaid_against_terms]
          description: |
            underpaid: the schedule has ended and the ledger still shows money
            owed. overpaid: the ledger shows more repaid than lent; the society
            owes the member. prepaid_against_terms: nothing is owed, but before the
            schedule ended, on a product that does not allow early repayment.

    LoanInstalmentPosition:
      type: object
      required: [n, dueOn, amountKobo, paidKobo, state]
      description: Repayments are allocated to the OLDEST instalment first.
      properties:
        n: { type: integer }
        dueOn: { type: string, format: date }
        amountKobo: { $ref: '#/components/schemas/Magnitude' }
        paidKobo: { $ref: '#/components/schemas/Magnitude' }
        state:
          type: string
          enum: [paid, part_paid, missed, due]
          description: "missed: its due date has passed and it is not fully covered. due: not yet due."

    LoanPosition:
      type: object
      required: [loanId, societyId, memberId, productCode, productName, principalKobo, termMonths, purpose,
                 agreedAt, asOf, approvalStatus, disbursedOn, outstandingKobo, dueToDateKobo, paidToDateKobo,
                 arrearsKobo, missedInstalments, daysInArrears, condition, disagreement, reason, instalments]
      properties:
        loanId: { type: string, format: uuid }
        societyId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        productCode: { type: string }
        productName: { type: string }
        principalKobo: { $ref: '#/components/schemas/Magnitude' }
        termMonths: { type: integer }
        purpose: { type: string }
        agreedAt: { type: string, format: date-time }
        asOf: { type: string, format: date }
        approvalStatus:
          type: string
          nullable: true
          enum: [awaiting, approved, rejected, expired]
          description: "The disbursement request's approval_status NOW (an approval is not value-dated); null when none has been raised."
        disbursedOn:
          type: string
          format: date
          nullable: true
          description: "The disbursement's value date; null when not disbursed by asOf."
        outstandingKobo:
          description: |
            From the LEDGER: the loan's lines on member_loan, value date on or
            before asOf. Section-0 signed: positive is owed to the society;
            NEGATIVE is an overpayment, owed to the member.
          allOf: [{ $ref: '#/components/schemas/Kobo' }]
        dueToDateKobo: { $ref: '#/components/schemas/Magnitude' }
        paidToDateKobo: { $ref: '#/components/schemas/Magnitude' }
        arrearsKobo:
          description: dueToDate minus paidToDate, when positive; else zero.
          allOf: [{ $ref: '#/components/schemas/Magnitude' }]
        missedInstalments: { type: integer }
        daysInArrears:
          type: integer
          description: "Days from the due date of the oldest instalment not fully covered to asOf; 0 when none."
        condition: { $ref: '#/components/schemas/LoanCondition' }
        disagreement:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/LoanDisagreement' }]
        reason:
          type: string
          description: The server's sentence for the condition. Shown as given.
        instalments:
          type: array
          items: { $ref: '#/components/schemas/LoanInstalmentPosition' }

    LoanBook:
      type: object
      required: [asOf, loans]
      properties:
        asOf: { type: string, format: date }
        loans:
          type: array
          description: Ordered by agreedAt, then loanId.
          items: { $ref: '#/components/schemas/LoanPosition' }

    # ---- APPROVALS over HTTP (PRD 8.4; 0007, 0010) ---------------------------------
    # The status is DERIVED by the server (approval_status), never stored. One
    # record, two projections. The officer projection (any current post, the
    # auditor included) shows who signed and who rejected. The member projection
    # (the request's member) shows progress and why, never who. On the FRAUD
    # PATH (looks_wrong) it shows "referred" and no reason at all: Stage 5's rule
    # is that it does not go back to the requester, who may be part of it.

    ApprovalStatus:
      type: string
      enum: [awaiting, approved, rejected, expired, referred]
      description: |
        referred appears ONLY in the member projection, for a request rejected as
        looks_wrong: the member learns it is with the society's committee,
        nothing more.

    RejectionReason:
      type: string
      description: Stage 5's four reasons, four different outcomes (frontend lib/approvals.ts).
      enum: [documents_missing, amount_wrong, not_eligible, looks_wrong]

    ApprovalSignature:
      type: object
      required: [userId, memberId, post, signedAt]
      properties:
        userId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        post: { $ref: '#/components/schemas/OfficerPost' }
        signedAt: { type: string, format: date-time }

    ApprovalRejection:
      type: object
      required: [reason, note, rejectedAt, byUserId, byPost]
      properties:
        reason: { $ref: '#/components/schemas/RejectionReason' }
        note: { type: string, nullable: true }
        rejectedAt: { type: string, format: date-time }
        byUserId:
          type: string
          format: uuid
          nullable: true
          description: NULL in the member projection. The member is told why, never by whom.
        byPost:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/OfficerPost' }]

    ApprovalView:
      type: object
      required: [requestId, societyId, kind, amountKobo, memberId, loanId, reason, required, raisedAt, expiresAt,
                 projection, status, signedCount, signatures, rejection, escalated, nextStep, raisedBy, resubmitsId,
                 authorisedCharges]
      properties:
        requestId: { type: string, format: uuid }
        societyId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/MovementKind' }
        amountKobo: { $ref: '#/components/schemas/Magnitude' }
        memberId: { type: string, format: uuid, nullable: true }
        loanId: { type: string, format: uuid, nullable: true }
        reason:
          type: string
          nullable: true
          description: Why the request was raised (a write-off's stated reason).
        required: { type: integer }
        raisedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        projection:
          type: string
          enum: [member, officer]
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        signedCount:
          type: integer
          description: Distinct people who have signed. Both projections.
        signatures:
          type: array
          nullable: true
          description: Who signed, in what post, when. NULL in the member projection.
          items: { $ref: '#/components/schemas/ApprovalSignature' }
        rejection:
          nullable: true
          description: NULL until rejected; NULL in the member projection on the fraud path.
          allOf: [{ $ref: '#/components/schemas/ApprovalRejection' }]
        escalated:
          type: boolean
          description: True when rejected as looks_wrong (to the committee and the auditor). Always false in the member projection.
        nextStep:
          type: string
          nullable: true
          description: |
            What the member should do now, as a sentence to show as written. Set
            ONLY in the member projection of a referred request: "Speak to your
            secretary." Referred alone says something happened and invites a
            guess; this routes the member to ask, without saying what was
            suspected or by whom. NULL everywhere else.
        raisedBy:
          type: string
          format: uuid
          nullable: true
          description: |
            Who raised the request (0016: a request has an author). Officer
            projection only; NULL in the member's, as signers are. NULL too for
            a request raised before 0016 recorded it.
        resubmitsId:
          type: string
          format: uuid
          nullable: true
          description: The rejected request this one replaces, if it is a resubmission. Both projections.
        authorisedCharges:
          nullable: true
          description: |
            THE FINAL CHARGE: fixed when the payout was authorised (its hold),
            from the society's series in force that day. NULL until then. Both
            projections: this is where the member is told the figure that
            applies. A quote before it (GET /members/{id}/withdrawal-quote) is
            indicative only.
          allOf: [{ $ref: '#/components/schemas/Charges' }]

    ApprovalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first. Empty, never null.
          items: { $ref: '#/components/schemas/ApprovalView' }

    RaiseWithdrawal:
      type: object
      required: [memberId, amountKobo, pinProofId]
      description: |
        A withdrawal request. The server sets everything else: the society's
        quorum, the expiry from the society's window (0016), and the raiser
        (the caller). An expiry sent in the body is ignored.
      properties:
        memberId: { type: string, format: uuid }
        amountKobo:
          $ref: '#/components/schemas/Magnitude'
          description: What the member asks to receive. The charges go on top.
        pinProofId:
          type: string
          format: uuid
          description: A proof with act withdrawal_request, minted by the raiser.
        resubmitsId:
          type: string
          format: uuid
          nullable: true
          description: The rejected request this replaces (the same member's, of this society).

    SignApproval:
      type: object
      required: [pinProofId]
      properties:
        pinProofId:
          type: string
          format: uuid
          description: A proof from POST /auth/pin-proofs with act approval_signature, minted by the signer.

    RejectApproval:
      type: object
      required: [pinProofId, reason]
      properties:
        pinProofId:
          type: string
          format: uuid
          description: A proof from POST /auth/pin-proofs with act approval_rejection, minted by the rejecter.
        reason: { $ref: '#/components/schemas/RejectionReason' }
        note:
          type: string
          description: Required for looks_wrong; optional otherwise.

    Charges:
      type: object
      required: [partnerFeeKobo, vatKobo, statutoryLevyKobo, argonMarginKobo, totalKobo]
      description: |
        A movement's charges, AS THE SERVER COMPUTED THEM (0011, 0013): the
        society's series in force on the date, four components, never summed
        into one figure but totalled for convenience. A client never supplies a
        charge; one sent in a body is ignored.
      properties:
        partnerFeeKobo: { $ref: '#/components/schemas/Magnitude' }
        vatKobo: { $ref: '#/components/schemas/Magnitude' }
        statutoryLevyKobo: { $ref: '#/components/schemas/Magnitude' }
        argonMarginKobo: { $ref: '#/components/schemas/Magnitude' }
        totalKobo: { $ref: '#/components/schemas/Magnitude' }

    Deduction:
      type: object
      required: [kind, amountKobo, reason, loanId, borrowerName]
      description: |
        One thing standing between a member's savings and what they may
        withdraw, with WHY, as a sentence to show as written. A member whose
        figure is smaller than their savings is told what took it, not only
        that something did.
      properties:
        kind:
          type: string
          enum: [floor, guarantee, authorised_payout]
          description: |
            floor: the society's minimum balance. guarantee: a loan the member
            guarantees, held IN FULL (the loan's whole outstanding balance: the
            conservative default until the society decides how much a guarantor
            answers for). authorised_payout: payouts already authorised (held)
            and not yet paid or released, their charges included.
        amountKobo: { $ref: '#/components/schemas/Magnitude' }
        reason: { type: string }
        loanId: { type: string, format: uuid, nullable: true, description: The guaranteed loan; guarantee only. }
        borrowerName: { type: string, nullable: true, description: Whose loan; guarantee only. }

    Withdrawable:
      type: object
      required: [memberId, asOf, savingsBalanceKobo, withdrawableKobo, unavailable, deductions]
      description: |
        A member's savings and what they may withdraw now. The withdrawable
        figure is the savings less every deduction, never below zero, and A
        WITHDRAWAL'S CHARGE COMES OUT OF IT: a request is accepted when the
        amount and its charge together fit (0016 checks exactly this when it is
        raised, and the hold again before money moves). Ask
        GET /members/{id}/withdrawal-quote for a given amount.
      properties:
        memberId: { type: string, format: uuid }
        asOf: { type: string, format: date-time }
        savingsBalanceKobo:
          $ref: '#/components/schemas/SavingsBalance'
          description: ALWAYS shown, whatever else cannot be worked out.
        withdrawableKobo:
          nullable: true
          description: NULL when it cannot be worked out; `unavailable` says why.
          allOf: [{ $ref: '#/components/schemas/Magnitude' }]
        unavailable:
          nullable: true
          description: Why withdrawableKobo is NULL (floor_unset), in words to show. NULL when it is shown.
          allOf: [{ $ref: '#/components/schemas/Problem' }]
        deductions:
          type: array
          description: Everything deducted, with why. Empty, never null.
          items: { $ref: '#/components/schemas/Deduction' }

    WithdrawalQuote:
      type: object
      required: [memberId, amountKobo, charges, totalOutKobo, withinWithdrawable, withdrawableUnavailable, indicative, quotedOn, note]
      description: |
        WHAT A WITHDRAWAL OF THIS AMOUNT WOULD COST TODAY. INDICATIVE, NOT
        BINDING: the charge that applies is fixed when the payout is authorised
        (its hold), from the society's series in force that day, and is shown
        on the request (authorisedCharges). If the series changes between the
        two, the hold's figure applies.
      properties:
        memberId: { type: string, format: uuid }
        amountKobo: { $ref: '#/components/schemas/Magnitude' }
        charges: { $ref: '#/components/schemas/Charges' }
        totalOutKobo:
          $ref: '#/components/schemas/Magnitude'
          description: The amount and its charges together, what leaves the member's savings.
        withinWithdrawable:
          type: boolean
          nullable: true
          description: |
            Whether the total fits the member's withdrawable figure now. NULL
            when that figure cannot be worked out: "we cannot tell whether this
            fits", never "it does not fit". withdrawableUnavailable then says why.
        withdrawableUnavailable:
          nullable: true
          description: |
            Why withinWithdrawable is NULL, the same reason /withdrawable gives
            (floor_unset), in words to show BESIDE the fee: without it a
            confident fee reads as the live part of the screen and the blank
            beside it as a loading state. NULL when withinWithdrawable is set.
          allOf: [{ $ref: '#/components/schemas/Problem' }]
        indicative:
          type: boolean
          description: Always true. Present so that no client can mistake a quote for the charge.
        quotedOn: { type: string, format: date }
        note:
          type: string
          description: The sentence to show beside a quote, saying it is indicative and when the figure is fixed.

    Discrepancy:
      type: object
      required: [kind, expected, observed]
      description: |
        Something recorded that a person must explain (0012,
        ledger_discrepancies). The ledger records what happened; this says how
        it differs from what was authorised, in words a resolver can act on
        without going to the logs.
      properties:
        kind:
          type: string
          enum: [payout_without_hold, payout_amount_differs, hold_paid_twice,
                 payout_on_released_hold, payout_overdraws, charge_undetermined]
        expected: { type: string }
        observed: { type: string }

    MoneyMovement:
      type: object
      required: [entryId, kind, societyId, memberId, amountKobo, memberAmountKobo, valueDate,
                 chargeDetermined, charges, flags, postedBy]
      description: |
        A recorded contribution or payout. RECORDED MEANS IT HAPPENED: flags
        say how it differs from what was authorised; they never mean it was
        not recorded.
      properties:
        entryId: { type: string, format: uuid }
        kind:
          type: string
          enum: [contribution_in, withdrawal_out]
        societyId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        amountKobo:
          $ref: '#/components/schemas/Magnitude'
          description: What arrived at, or left, the bank.
        memberAmountKobo:
          $ref: '#/components/schemas/Magnitude'
          description: |
            What the member's savings moved by: a contribution less its charges
            (credited), a payout plus its charges (debited; the fee is on top).
        valueDate: { type: string, format: date }
        holdId: { type: string, format: uuid, nullable: true }
        payoutReference: { type: string, nullable: true }
        chargeDetermined:
          type: boolean
          description: |
            false when the society's series could not determine the charge: the
            contribution was recorded UNCHARGED, charges is null (never zeros:
            the charge is UNDETERMINED, not zero), and flags carries
            charge_undetermined.
        charges:
          allOf: [{ $ref: '#/components/schemas/Charges' }]
          nullable: true
        flags:
          type: array
          items: { $ref: '#/components/schemas/Discrepancy' }
        postedBy: { $ref: '#/components/schemas/PostedBy' }

    RecordContribution:
      type: object
      required: [memberId, amountKobo, valueDate, pinProofId]
      properties:
        memberId: { type: string, format: uuid }
        amountKobo:
          $ref: '#/components/schemas/Magnitude'
          description: What arrived. Not zero.
        valueDate: { type: string, format: date, description: When the money arrived. }
        pinProofId:
          type: string
          format: uuid
          description: A proof from POST /auth/pin-proofs with act contribution_record, minted by the recorder.

    AuthorisePayout:
      type: object
      required: [pinProofId]
      properties:
        pinProofId:
          type: string
          format: uuid
          description: A proof with act withdrawal_authorisation, minted by the authoriser.

    PayoutHold:
      type: object
      required: [holdId, requestId, memberId, amountKobo, charges, totalKobo, authorisedBy, authorisedAt, state]
      description: |
        A payout AUTHORISED TO EXECUTE (0012): every judgement made before the
        money moves. The charges are fixed here; the recorded payout carries
        exactly these.
      properties:
        holdId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        amountKobo: { $ref: '#/components/schemas/Magnitude' }
        charges: { $ref: '#/components/schemas/Charges' }
        totalKobo:
          $ref: '#/components/schemas/Magnitude'
          description: The amount plus every charge, all of which must fit within what the member may withdraw.
        authorisedBy: { type: string, format: uuid }
        authorisedAt: { type: string, format: date-time }
        state:
          type: string
          enum: [open, paid, released]
        releaseReason: { type: string, nullable: true }

    ReleaseHold:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: Why the transfer will not happen (it definitively failed). Required; no step-up (decided 2026-10-13).

    RecordPayout:
      type: object
      required: [memberId, amountKobo, valueDate, payoutReference, pinProofId]
      description: |
        A payout THAT HAPPENED, recorded as it happened. holdId names the
        authorisation it carried out; without one it is still recorded, and
        flagged payout_without_hold.
      properties:
        holdId: { type: string, format: uuid, nullable: true }
        memberId: { type: string, format: uuid }
        amountKobo:
          $ref: '#/components/schemas/Magnitude'
          description: What the bank actually paid.
        valueDate: { type: string, format: date }
        payoutReference: { type: string, minLength: 1, description: The transfer's reference. One transfer is recorded once. }
        pinProofId:
          type: string
          format: uuid
          description: A proof with act withdrawal_payout, minted by the recorder.

    Me:
      type: object
      required: [userId, fullName, memberships]
      description: |
        WHO THE CALLER IS, and nothing about anyone else: the ids every other
        endpoint takes (finding 40). Each membership is one of the caller's
        own member records, with the posts it holds TODAY (an ended or a
        not-yet-started appointment is not a post). Routing follows from it:
        a post in a society opens its officer surfaces; none, the member's.
      properties:
        userId: { type: string, format: uuid }
        fullName: { type: string }
        csrfToken:
          type: string
          description: |
            A COOKIE session's CSRF token, the same one sign-in gave: how a
            browser page recovers it after a reload. Absent for a Bearer
            session, which has no use for one.
        memberships:
          type: array
          description: One per member record the caller holds, ordered by society code. Empty, never null, for a user with none.
          items: { $ref: '#/components/schemas/Membership' }

    Membership:
      type: object
      required: [societyId, societyCode, societyName, memberId, memberNumber, memberStatus, posts]
      properties:
        societyId: { type: string, format: uuid }
        societyCode: { type: string }
        societyName: { type: string }
        memberId: { type: string, format: uuid }
        memberNumber: { type: string }
        memberStatus: { type: string, description: "The member record's status, as the society holds it." }
        posts:
          type: array
          description: Current posts only. Empty, never null.
          items: { $ref: '#/components/schemas/HeldPost' }

    HeldPost:
      type: object
      required: [post, signatory, heldFrom]
      properties:
        post: { $ref: '#/components/schemas/OfficerPost' }
        signatory: { type: boolean }
        heldFrom: { type: string, format: date }

    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: |
        A session token from sign-in, for clients that are NOT browsers. The
        server stores only its digest. A request carrying an Origin AND a
        Bearer header is refused, 401 bearer_from_browser: enforcement that a
        page never holds a credential in script, NOT a security boundary (a
        client that is not a browser sends whatever Origin it likes).
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-argon_session
      description: |
        A BROWSER's session (LEDGER_CONTRACT.md §12): HttpOnly, Secure,
        SameSite=Strict, Path=/, no Domain; set by sign-in and code-verify for
        a caller that sent an Origin. Every state-changing request must carry
        X-CSRF-Token, the session's own (403 csrf_failed otherwise, before
        any handler runs; the session untouched, nothing counted against a
        lockout). A request with this cookie AND a Bearer header is refused,
        400 ambiguous_credentials. A 401 to a request that carried it clears
        it. The device cookie (__Secure-argon_device, Path=/auth/) is not a
        session: alone, it is 401.

paths:
  /healthz:
    get:
      summary: Liveness and database reachability
      responses:
        '200': { description: ok }
        '503': { description: database unreachable }

  /societies/{societyId}/ledger/batches:
    post:
      operationId: postLedgerBatch
      summary: postAll — commit a whole import in ONE transaction (LEDGER_CONTRACT §1)
      description: |
        ONE TRANSACTIONAL CALL. Either every row is written or none is; there is
        no partial outcome. The client sends MOVEMENTS (member, amount); the
        server builds the double entry from the society's accounts BY ROLE
        (0004), so the client never chooses an account:
        opening_balance debits migration_control and credits the member's
        member_savings line (D-01).

        Idempotency-Key is the reference, minted CLIENT-SIDE from the uploaded
        file's content (lib/importReference.ts). The server never generates one.
        It is unique per society.

        Order of decisions: authenticate (401) → may this caller import for
        this society (404 / 403) → has this reference already been committed
        (200, whatever the body now says) → is the body sound (400 / 422) →
        write everything or nothing (201, or 500 with nothing written).

        A REFUSED OR FAILED CALL WRITES NOTHING AND DOES NOT CLAIM THE
        REFERENCE: a retry with the same key can succeed. The key is recorded
        in the same transaction as the entries, never before them.

        Imports for one society are serialised, so two different files naming
        the same member cannot both give that member an opening balance.
      security: [{ session: [] }]
      parameters:
        - { name: societyId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LedgerBatch' }
      responses:
        '201':
          description: Committed. Nothing had been posted under this reference before.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostedRecord' }
        '200':
          description: |
            Already committed. NOTHING WAS WRITTEN. The body describes what the
            FIRST commit did — its rows, total, as-at date and posting time —
            read from the entries, not from this request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostedRecord' }
        '400':
          description: Malformed — money that is not a non-negative decimal kobo string, a missing field. Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No valid session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: |
            not_permitted: an officer of this society whose post does not import
            (the read-only auditor included). step_up_required: no usable PIN
            proof (missing, stale, spent, someone else's, or minted for another
            act). Nothing is written and the reference is not claimed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such society — or one the caller holds no current post in. Indistinguishable by design.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The society's chart cannot take this batch (no single migration_control or member_savings account). Nothing is written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Refused, with the rows that caused it. Nothing is written and the reference is not claimed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchRefusal' }
        '500':
          description: |
            The write failed. NOTHING WAS WRITTEN and the reference is not
            claimed: retrying with the same key is safe and can succeed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/sign-in:
    post:
      operationId: postSignIn
      summary: Sign in with the one credential box and a PIN (public)
      description: |
        The credential is a member number or a phone number. ONE answer for an
        unregistered credential and a wrong PIN: the same status, the same
        body, the same time. A credential matching more than one PERSON (a
        shared family phone) signs in nobody: the right PIN routes to an
        officer (D-21). A known device signs in on the PIN alone; a new one
        gets a code to the one registered number, or an officer.

        The session's length follows the highest privilege the person holds
        (8 hours for anyone holding a post, 30 days otherwise), never the
        surface the client says it is: `surface` is informational only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInRequest' }
      responses:
        '200':
          description: signed_in, code_sent, or see_officer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInResult' }
        '400':
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: refused — the ONE answer to an unregistered credential and a wrong PIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: try_later — locked, for a registered and an unregistered credential alike.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: "sign_in_unavailable — DELIBERATE, not a defect: this server runs without an auth service (pending the argon_auth connection). Nobody is signed in."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/codes/verify:
    post:
      operationId: postVerifyCode
      summary: Complete a new-device sign-in with the code sent to the registered phone (public)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyCodeRequest' }
      responses:
        '200':
          description: signed_in, with a device token for next time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInResult' }
        '400':
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: refused — a wrong, spent or expired code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: try_later.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: "sign_in_unavailable — DELIBERATE, not a defect: this server runs without an auth service (pending the argon_auth connection). Nobody is signed in."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/sign-out:
    post:
      operationId: postSignOut
      summary: End this session
      security: [{ session: [] }]
      responses:
        '204':
          description: |
            The session has ended; its token reaches nothing. For a cookie
            session the same response clears __Host-argon_session; the device
            cookie is untouched and the device stays known (a session ended by
            its own holder never revokes its device).
        '401':
          description: No valid session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: "sign_in_unavailable — DELIBERATE, not a defect: this server runs without an auth service (pending the argon_auth connection). Nobody is signed in."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/pin-proofs:
    post:
      operationId: postPinProof
      summary: The PIN step-up — a proof that authorises ONE act of ONE kind (0005)
      description: |
        The signed-in person re-enters their PIN. A right PIN mints one proof
        for the session holder, scoped to the act named here (bound at mint,
        never at use: a proof minted for an import does not satisfy a
        reversal), good for five minutes, spent by the act itself.

        A wrong PIN mints nothing and counts towards the SAME per-account
        lockout as sign-in. Otherwise a stolen session is an unlimited PIN oracle.

        General by design: imports, reversals, officer resets and dispute
        corrections all take a proof from here.
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PinProofRequest' }
      responses:
        '201':
          description: Minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PinProof' }
        '400':
          description: No such act, or a malformed body. Nothing is minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No valid session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: pin_refused — the PIN is wrong. Nothing is minted; the failure is counted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: try_later — the account is locked, as it would be at sign-in. Nothing is minted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            step_up_unavailable — DELIBERATE, not a defect: this server runs
            without an auth service (it needs the argon_auth database
            connection and the SMS provider, both pending). Nothing is minted,
            so nothing that needs a step-up (an import) can be authorised here.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /members/{memberId}/statement:
    get:
      operationId: getMemberStatement
      summary: A member's savings statement — one record, two projections
      description: |
        Served to the MEMBER (the person the record belongs to) and to an
        OFFICER of the member's society (any current post, the read-only
        internal auditor included), by one handler and one query. The officer
        projection adds attribution; nothing else differs.

        Anyone else receives 404, byte-for-byte the same as for a member id that
        does not exist, so this endpoint cannot be used to discover who is a
        member where.

        Lines are the member's own: in an entry that also moves another
        member's savings, the other member's line is never returned.
      security: [{ session: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, description: A VALUE date; undated entries are before it., schema: { type: string, format: date } }
        - { name: to, in: query, required: false, description: A VALUE date., schema: { type: string, format: date } }
      responses:
        '200':
          description: The statement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberStatement' }
        '401':
          description: No session, or one that is not valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such member — or one the caller may not read. Indistinguishable by design.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---- The society's books (LEDGER_CONTRACT §5). Who may read: an OFFICER of
  # the society holding a CURRENT post (the read-only internal auditor
  # included). Anyone else, a member of the society included, receives 404,
  # byte-for-byte the same as for a society that does not exist.
  /societies/{societyId}/accounts:
    get:
      operationId: getChartOfAccounts
      summary: The society's chart of accounts
      security: [{ session: [] }]
      parameters:
        - { name: societyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The chart, ordered by code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChartOfAccounts' }
        '401':
          description: No session, or one that is not valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such society, or one the caller may not read. Indistinguishable by design.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /societies/{societyId}/trial-balance:
    get:
      operationId: getTrialBalance
      summary: Every account's debits, credits and balance as at a date
      description: |
        asOf is REQUIRED and is a value date: the server never assumes "today".
        The totals sum to zero by construction; if they ever do not, the answer
        is 500 ledger_does_not_balance, never a trial balance with a variance.
      security: [{ session: [] }]
      parameters:
        - { name: societyId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: The trial balance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrialBalance' }
        '500':
          description: |
            ledger_does_not_balance: the society's books do not sum to zero. A
            DEFECT, surfaced loudly, never a trial balance with a variance. (Every
            entry balances at commit, and 0006 keeps every line in its entry's
            society, so this cannot be constructed by a test; the check stays.)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: No session, or one that is not valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such society, or one the caller may not read. Indistinguishable by design.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /societies/{societyId}/accounts/{accountCode}/ledger:
    get:
      operationId: getGeneralLedger
      summary: One account's entries with a running balance
      security: [{ session: [] }]
      parameters:
        - { name: societyId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: accountCode, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: The account's ledger.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneralLedger' }
        '401':
          description: No session, or one that is not valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such society (or not the caller's to read), or no such account in it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /societies/{societyId}/journal:
    get:
      operationId: getJournal
      summary: Entries with every line, filtered by reference, member, actor and value date
      description: |
        Filters combine (AND). reference is how an import is audited after the
        fact. memberId matches entries with any line naming that member.
        actorUserId matches who posted. from/to are value dates; with `from`
        given, NULL-dated entries are before it and excluded.
      security: [{ session: [] }]
      parameters:
        - { name: societyId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reference, in: query, required: false, schema: { type: string } }
        - { name: memberId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: actorUserId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: The matching entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Journal' }
        '401':
          description: No session, or one that is not valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such society, or one the caller may not read. Indistinguishable by design.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---- Loans: the read side. Who reads a loan: its BORROWER, and an officer of
