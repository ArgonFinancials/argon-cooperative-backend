        - { name: loanId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanPosition' }
        '401':
          description: No session, or one that is not valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such loan, or one the caller may not read. Indistinguishable by design.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /members/{memberId}/loans:
    get:
      operationId: getMemberLoans
      summary: A member's loans as at a value date (the member, or an officer of their society)
      security: [{ session: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanBook' }
        '401':
          description: No session, or one that is not valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such member, or one the caller may not read. Indistinguishable by design.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /societies/{societyId}/loans:
    get:
      operationId: getSocietyLoans
      summary: The society's loan book as at a value date (officers only)
      description: |
        condition=disagreement is the officers' list of loans whose schedule
        and ledger do not agree, each with its reason. (The inbox will rank them.)
      security: [{ session: [] }]
      parameters:
        - { name: societyId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asOf, in: query, required: true, schema: { type: string, format: date } }
        - { name: condition, in: query, required: false, schema: { $ref: '#/components/schemas/LoanCondition' } }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanBook' }
        '401':
          description: No session, or one that is not valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such society, or one the caller may not read. Indistinguishable by design.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---- Approvals. Who reads a request: an officer of its society holding a
  # current post (the auditor included), or the request's member. Anyone else:
  # 404, byte-identical to a request that does not exist. Signing and
  # rejecting: a current SIGNATORY, with their own PIN step-up.
  /approvals/{requestId}:
    get:
      operationId: getApproval
      summary: One approval request, in the caller's projection
      security: [{ session: [] }]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalView' }
        '401':
          description: "No session, or one that is not valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: "No such request, or one the caller may not read. Indistinguishable by design."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /approvals/{requestId}/signatures:
    post:
      operationId: signApproval
      summary: Sign a request, resting on the signer's own PIN step-up
      security: [{ session: [] }]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignApproval' }
      responses:
        '201':
          description: Signed. The request, officer projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalView' }
        '400':
          description: "bad_request: the body is malformed."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: "No session, or one that is not valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: "step_up_required (no valid proof for approval_signature, the caller's own, unspent); not_a_signatory (no current signing post here, the auditor included); conflict_of_interest (the borrower or a guarantor of the loan the request is for)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: "No such request, or one the caller may not read."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: "request_closed (expired or rejected); already_signed."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /approvals/{requestId}/rejections:
    post:
      operationId: rejectApproval
      summary: Reject a request with one of the four reasons, resting on the rejecter's own PIN step-up
      security: [{ session: [] }]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectApproval' }
      responses:
        '201':
          description: Rejected. The request, officer projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalView' }
        '400':
          description: "bad_request: the body is malformed, or the reason is not one of the four."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: "No session, or one that is not valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: "step_up_required; not_a_signatory."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: "No such request, or one the caller may not read."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: "request_closed (approved, expired or already rejected); signed_cannot_reject (the caller signed it)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "note_required: looks_wrong goes to the committee and the auditor with the words that sent it."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---- MONEY: contributions in, payouts out (0011, 0012) ------------------------
  # Recording and authorising are different duties (the role matrix,
  # frontend lib/permissions.ts): recording money is the treasurer's or the
  # secretary's (record_cash); authorising a release is a signatory's
  # (chairman, treasurer, secretary). An officer of the society without the
  # duty is told not_permitted; anyone else gets 404, identical to a society,
  # request or hold that does not exist. Every refusal writes nothing.

  /societies/{societyId}/contributions:
    post:
      operationId: recordContribution
      summary: Record a contribution that arrived, on the recorder's own PIN step-up
      description: |
        The server builds the double entry by role (the bank in, the member's
        savings credited, each charge component on its own line) and charges it
        by the society's series on the value date. MONEY THAT ARRIVED IS
        RECORDED: where the series cannot determine the charge, it is recorded
        uncharged, chargeDetermined is false, charges is null, and the flag
        charge_undetermined says which component is missing.

        Idempotency-Key is the client's reference for this contribution,
        minted CLIENT-SIDE once per contribution and reused on every retry
        (0015: unique within the society). On a phone on 3G a retry is normal:
        a repeat of a recorded key answers 200 with the FIRST record, writes
        nothing, and needs no step-up, as postAll does.

        Nobody records money into their own savings (LEDGER_CONTRACT §10).
      security: [{ session: [] }]
      parameters:
        - { name: societyId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordContribution' }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoneyMovement' }
        '200':
          description: |
            Already recorded under this Idempotency-Key. NOTHING WAS WRITTEN.
            The body is the FIRST record, read from the ledger, not from this
            request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoneyMovement' }
        '400':
          description: "bad_request: malformed (money not a kobo string, a missing field, no Idempotency-Key)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: "No session, or one that is not valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: "step_up_required (no valid contribution_record proof, the caller's own, unspent); not_permitted (an officer here whose post does not record money); conflict_of_interest (the member credited is the recorder: nobody attests to a movement they benefit from)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: "No such society, or one the caller holds no current post in."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "zero_amount; unknown_member (not a member of this society)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /approvals/{requestId}/holds:
    post:
      operationId: authorisePayout
      summary: Authorise an approved withdrawal to execute (the hold), on the authoriser's own PIN step-up
      description: |
        Every judgement before the money moves (0012): the request is an
        approved withdrawal; the charges are the server's, fixed here; the
        amount plus every charge fits within what the member may withdraw
        (savings, less guarantees held, the floor, and other open holds). One
        open hold per request. A refusal carries the database's reason with its
        figures.
      security: [{ session: [] }]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorisePayout' }
      responses:
        '201':
          description: Authorised.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutHold' }
        '400':
          description: "bad_request."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: "No session, or one that is not valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: "step_up_required; not_permitted (an officer here who is not a signatory, the auditor included); conflict_of_interest (the payout is from the authoriser's own savings)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: "No such request, or one the caller may not read."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: "not_approved (the message says what the request is); hold_open (release the open hold first)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "exceeds_withdrawable (the message carries the figures); not_configured (a charge component or the account floor is not set: the message says which)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /holds/{holdId}/releases:
    post:
      operationId: releaseHold
      summary: Release a hold whose transfer definitively failed, saying why
      security: [{ session: [] }]
      parameters:
        - { name: holdId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseHold' }
      responses:
        '201':
          description: Released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutHold' }
        '400':
          description: "bad_request."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: "No session, or one that is not valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: "not_permitted (an officer here who is not a signatory); conflict_of_interest (the hold is on the releaser's own payout: a release frees their own withdrawable)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: "No such hold, or one the caller may not read."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: "hold_paid (a paid hold is never released); hold_released (already)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "reason_required."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /societies/{societyId}/payouts:
    post:
      operationId: recordPayout
      summary: Record a payout that happened, on the recorder's own PIN step-up
      description: |
        THE LEDGER RECORDS WHAT HAPPENED (LEDGER_CONTRACT §11). Refused only
        when malformed and a correct form exists: no step-up, the same transfer
        recorded twice, the wrong member's savings for the hold. Everything
        else is recorded, and flags say how it differs from what was authorised
        (no hold, a different amount, a second payout on a hold, a payout on a
        released hold, savings overdrawn). With a hold, the charges are the
        hold's; without one, the series' on the value date where they can say,
        otherwise none (and payout_without_hold sends it to a person anyway).
      security: [{ session: [] }]
      parameters:
        - { name: societyId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordPayout' }
      responses:
        '201':
          description: Recorded, with any flags.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoneyMovement' }
        '400':
          description: "bad_request: malformed, or no transfer reference."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: "No session, or one that is not valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: "step_up_required; not_permitted (an officer here whose post does not record money); conflict_of_interest (the payout is from the recorder's own savings); duties_separated (the recorder authorised this payout's hold: authorising and attesting are different duties)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: "No such society, or one the caller holds no current post in."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: "already_recorded: this transfer reference is already in the ledger (the message names its entry). Nothing new is written."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "zero_amount; unknown_member; unknown_hold (not a hold of this society); not_the_holds_member (a held payout comes out of the hold's member's savings)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me:
    get:
      operationId: getMe
      summary: Who the caller is - their own member records and current posts
      security: [{ session: [] }]
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          description: "No session, or one that is not valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ---- WITHDRAWAL REQUESTS: raised, and listed (0016) ----------------------------
  /societies/{societyId}/withdrawal-requests:
    post:
      operationId: raiseWithdrawalRequest
      summary: Raise a withdrawal request, on the raiser's own PIN step-up
      description: |
        Raised by the member it pays, or by an officer who records money (the
        treasurer or the secretary) for a member without a phone. The raiser is
        recorded and never signs it (LEDGER_CONTRACT §10). Within what the
        member may withdraw when raised, refused with the figures; the hold
        checks again before money moves. The expiry is the society's window,
        set by the server.

        Idempotency-Key is the request's reference, minted CLIENT-SIDE once per
        request and reused on every retry (unique within the society). A repeat
        answers 200 with the FIRST request, writes nothing, and needs no step-up.
      security: [{ session: [] }]
      parameters:
        - { name: societyId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RaiseWithdrawal' }
      responses:
        '201':
          description: Raised. The request, in the raiser's projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalView' }
        '200':
          description: Already raised under this key. NOTHING WAS WRITTEN. The first request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalView' }
        '400':
          description: "bad_request: malformed, or no Idempotency-Key."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: "No session, or one that is not valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: "step_up_required; not_permitted (neither the member nor an officer who records money: another member, the auditor, the chairman)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: "No such society, or one the caller has no member record or post in."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: "not_resubmittable: resubmitsId is not a rejected request of the same member in this society (the message says which)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "zero_amount; unknown_member; exceeds_withdrawable (the message carries the figures); not_configured (the quorum, the floor or a charge component is not set: the message says which); quorum_unreachable (fewer signatories may sign it than the quorum needs, the raiser and the member it pays never signing: the message says how many may, how many are needed, and what to do)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /members/{memberId}/withdrawal-requests:
    get:
      operationId: getMemberWithdrawalRequests
      summary: A member's own withdrawal requests, newest first, in the member projection
      description: |
        Progress and outcome, never who signed or rejected (the member
        projection). On the fraud path the member sees "referred" and what to do
        next, nothing else. Only the member: anyone else gets 404, identical to a
        member that does not exist.
      security: [{ session: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: The member's requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalList' }
        '401':
          description: "No session, or one that is not valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: "No such member, or not the caller's own."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /members/{memberId}/withdrawable:
    get:
      operationId: getMemberWithdrawable
      summary: A member's savings, what they may withdraw now, and what was deducted and why
      description: |
        READING IS TIED TO THE DUTY (decided 2026-10-21): the member; the
        treasurer and the secretary of the member's society, who raise for a
        member without a phone; and the internal auditor, whose task it is. A
        member's savings are their personal position, not the society's books:
        any other officer (the chairman included) gets 404, identical to a
        member that does not exist, as does anyone else. A member does NOT yet
        see who read their figure (an open gap, deploy/README.md finding 50).
        The savings are always shown; the
        withdrawable figure is NULL with the reason when it cannot be worked
        out (the society has set no floor).
      security: [{ session: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The member's position.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawable' }
        '401':
          description: "No session, or one that is not valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: "No such member, or not one the caller may read."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /members/{memberId}/withdrawal-quote:
    get:
      operationId: getWithdrawalQuote
      summary: What a withdrawal of an amount would cost today (indicative)
      description: |
        The society's series in force today, applied to the amount; whether
        the amount and its charges fit the member's withdrawable figure.
        INDICATIVE: the charge is fixed when the payout is authorised. Same
        readers as /withdrawable.
      security: [{ session: [] }]
      parameters:
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: amountKobo, in: query, required: true, schema: { $ref: '#/components/schemas/Magnitude' } }
      responses:
        '200':
          description: The quote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithdrawalQuote' }
        '400':
          description: "amountKobo is not a non-negative kobo string."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: "No session, or one that is not valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: "No such member, or not one the caller may read."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: "not_configured: the society's charges cannot be determined for this amount (a component or band not set), with the database's reason."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /societies/{societyId}/approval-requests:
    get:
      operationId: getSocietyApprovalRequests
      summary: The society's approval requests, newest first, in the officer projection
      description: |
        For the society's officers, the auditor included: who raised, who signed,
        who rejected. Filter by status (as the officer projection reads it:
        referred is a member's word and never appears here).
      security: [{ session: [] }]
      parameters:
        - { name: societyId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [awaiting, approved, rejected, expired]
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: The requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalList' }
        '401':
          description: "No session, or one that is not valid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: "No such society, or one the caller holds no current post in."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
